<!doctype html>
<!--
  Source for the Open Graph / social preview image (1200x630).
  Regenerate: serve the repo root over HTTP (e.g. `python -m http.server 8765`),
  open this file in a headless browser at a 1200x630 viewport, screenshot it to
  public/assets/og/endure-og.png and run `node scripts/og/compress.cjs`.
  Referenced from src/layouts/Layout.astro.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Sora'; font-weight: 400; src: url('../../node_modules/@fontsource/sora/files/sora-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Sora'; font-weight: 500; src: url('../../node_modules/@fontsource/sora/files/sora-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Sora'; font-weight: 700; src: url('../../node_modules/@fontsource/sora/files/sora-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Sora', system-ui, sans-serif;
    color: #FCFCFB;
    background:
      radial-gradient(900px 520px at 88% 110%, rgba(194, 85, 43, 0.38), transparent 62%),
      radial-gradient(700px 420px at 10% -10%, rgba(255, 255, 255, 0.06), transparent 60%),
      linear-gradient(135deg, #0E0F12 0%, #16181D 55%, #1C1F26 100%);
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0.2));
  }
  .copy {
    position: absolute; left: 72px; top: 0; bottom: 0;
    width: 600px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
  .brand img { height: 44px; width: auto; }
  .brand span { font-weight: 700; font-size: 26px; letter-spacing: 0.22em; }
  h1 {
    font-weight: 700; font-size: 54px; line-height: 1.08; letter-spacing: -0.02em;
  }
  h1 .accent { color: #E07A4F; }
  .sub {
    margin-top: 24px; font-size: 22px; line-height: 1.4; font-weight: 400;
    color: #B9BCC3; max-width: 540px;
  }
  .pills { display: flex; gap: 12px; margin-top: 34px; }
  .pill {
    font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 17px;
    letter-spacing: 0.04em; padding: 10px 16px; border-radius: 999px; white-space: nowrap;
    border: 1.5px solid rgba(255,255,255,0.22); color: #E5E5E1;
    background: rgba(255,255,255,0.05);
  }
  .pill.hot { border-color: #C2552B; background: #C2552B; color: #fff; }

  .phones { position: absolute; right: 0; top: 0; bottom: 0; width: 520px; }
  .phone {
    position: absolute; width: 268px; height: 586px;
    border-radius: 44px; background: #0E0F12; padding: 11px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.08) inset;
  }
  .phone .screen {
    width: 100%; height: 100%; border-radius: 34px; overflow: hidden; background: #FCFCFB;
  }
  .phone img { width: 100%; height: auto; display: block; }
  .phone.back  { left: 40px; top: 118px; transform: rotate(-7deg); opacity: 0.92; }
  .phone.front { left: 250px; top: 72px; transform: rotate(5deg); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="copy">
    <div class="brand">
      <img src="../../public/assets/ENDURE_E_icon_white_transparent_4k.png" alt="" />
      <span>ENDURE</span>
    </div>
    <h1>Stop doing FTP tests.<br /><span class="accent">Your rides are the test.</span></h1>
    <p class="sub">Indoor cycling app for smart trainers. FTP and VO2max from your normal rides, ERG and SIM control, riding in 30 seconds.</p>
    <div class="pills">
      <span class="pill hot">14 days free</span>
      <span class="pill">iOS</span>
      <span class="pill">Android</span>
      <span class="pill">No payment details</span>
    </div>
  </div>
  <div class="phones">
    <div class="phone back"><div class="screen"><img src="../../public/assets/app/today_dashboard.webp" alt="" /></div></div>
    <div class="phone front"><div class="screen"><img src="../../public/assets/app/ride_screen.webp" alt="" /></div></div>
  </div>
</body>
</html>
