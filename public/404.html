<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — ENDURE</title>
    <script>
      // Safety net, not the mechanism. Every route builds as
      // `<route>/index.html` (`build.format: 'directory'`) and GitHub Pages
      // answers the slash-less form with a real 301 onto the slash form, so a
      // request for /de never reaches this page. That redirect belongs to Pages,
      // though, and nothing in this repo can assert it, so recover a slash-less
      // URL here in case it ever stops happening.
      //
      // A path that genuinely does not exist cannot loop: the retry ends in a
      // slash, and this branch only fires on paths that do not.
      (function () {
        var path = window.location.pathname;
        if (path.length > 1 && !path.endsWith('/')) {
          window.location.replace(
            path + '/' + window.location.search + window.location.hash
          );
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0d0f11;
        color: #e2e8f0;
        text-align: center;
      }
      main { padding: 2rem; }
      h1 { font-size: 2rem; margin-bottom: 0.5rem; }
      p { color: #94a3b8; font-weight: 500; }
      a { color: #f05d23; font-weight: 600; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1>404 — Page not found</h1>
      <p>This page doesn't exist. <a href="/">Back to the homepage</a></p>
    </main>
  </body>
</html>
