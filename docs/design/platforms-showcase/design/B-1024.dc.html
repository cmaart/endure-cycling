<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hero window 1024</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=Sora:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FCFCFB}
a{color:#16181D}a:hover{color:#A84620}
</style>
</helmet>
<section style="width: 1024px; height: 1270px; box-sizing: border-box; padding: 96px 40px; background: #FCFCFB; font-family: Sora, system-ui, sans-serif; color: #16181D; display: flex; flex-direction: column; align-items: center">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 680px; text-align: center">
    <p style="margin: 0; display: flex; align-items: center; gap: 14px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.04em; color: #C2552B"><span aria-hidden="true" style="display: block; width: 40px; height: 1px; background: #C2552B"></span>{{t.eyebrow}}<span aria-hidden="true" style="display: block; width: 40px; height: 1px; background: #C2552B"></span></p>
    <h2 style="margin: 0; font-size: 42px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; color: #16181D">{{t.headline}}</h2>
    <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #5F646D">{{t.body}}</p>
  </div>

  <div style="position: relative; width: 944px; height: 710px; margin-top: 56px">
    <div style="position: absolute; left: 236px; top: 16px; width: 708px; z-index: 1">
      <button type="button" aria-label="{{t.openBrowser}}" style="display: block; width: 100%; box-sizing: border-box; margin: 0; padding: 0; border: 1px solid #E5E5E1; border-radius: 10px; background: #FFFFFF; overflow: hidden; box-shadow: 0 20px 60px rgba(22,24,29,0.10); cursor: zoom-in; font: inherit; text-align: left">
        <span style="position: relative; display: flex; align-items: center; height: 34px; padding: 0 12px; background: #F4F4F2; border-bottom: 1px solid #E5E5E1">
          <span aria-hidden="true" style="display: flex; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #D3D3CE"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #D3D3CE"></span><span style="width: 8px; height: 8px; border-radius: 999px; background: #D3D3CE"></span></span>
          <span style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 3px 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E5E5E1; font-size: 11px; line-height: 1.2; color: #5F646D; white-space: nowrap">app.endure-cycling.com</span>
        </span>
        <img src="../assets/web.webp" width="1920" height="1120" alt="{{t.altBrowser}}" style="display: block; width: 100%; height: auto">
      </button>
      <span style="position: absolute; left: 64px; top: -14px; z-index: 2; display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E5E5E1; box-shadow: 0 2px 8px rgba(22,24,29,0.08); font-size: 12px; font-weight: 600; line-height: 1; color: #16181D; white-space: nowrap">{{t.browser}}</span>
    </div>

    <div style="position: absolute; left: 0px; top: 60px; width: 841px; z-index: 2">
      <button type="button" aria-label="{{t.openWindows}}" style="display: block; width: 100%; box-sizing: border-box; margin: 0; padding: 0; border: 1px solid rgba(22,24,29,0.18); border-radius: 8px; background: #FFFFFF; overflow: hidden; box-shadow: 0 30px 80px rgba(22,24,29,0.14); cursor: zoom-in; font: inherit">
        <img src="../assets/windows.webp" width="1906" height="993" alt="{{t.altWindows}}" style="display: block; width: 100%; height: auto">
      </button>
      <span style="position: absolute; left: 14px; top: -14px; z-index: 2; display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E5E5E1; box-shadow: 0 2px 8px rgba(22,24,29,0.08); font-size: 12px; font-weight: 600; line-height: 1; color: #16181D; white-space: nowrap">{{t.windows}}</span>
    </div>

    <div style="position: absolute; left: 590px; top: 316px; width: 278px; z-index: 3">
      <button type="button" aria-label="{{t.openTablet}}" style="position: relative; display: block; width: 100%; box-sizing: border-box; margin: 0; padding: 2px; border: 0; border-radius: 26px; background: #4A4E57; box-shadow: 0 30px 80px rgba(22,24,29,0.16), inset 0 0 0 1px rgba(255,255,255,0.12); cursor: zoom-in; font: inherit">
        <span aria-hidden="true" style="position: absolute; right: -3px; top: 9%; width: 3px; height: 26px; border-radius: 0 2px 2px 0; background: #3A3E46"></span>
        <span aria-hidden="true" style="position: absolute; right: -3px; top: 20%; width: 3px; height: 40px; border-radius: 0 2px 2px 0; background: #3A3E46"></span>
        <span style="position: relative; display: block; padding: 4px; border-radius: 24px; background: #0E0F12">
        <span aria-hidden="true" style="position: absolute; top: 0.5px; right: 22%; width: 3px; height: 3px; border-radius: 999px; background: #2E3138"></span>
        <span style="position: relative; display: block; border-radius: 20px; overflow: hidden; background: #FFFFFF">
        <img src="../assets/tablet.webp" width="2076" height="2152" alt="{{t.altTablet}}" style="display: block; width: 100%; height: auto">
          <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 50%; width: 6px; margin-left: -3px; background: linear-gradient(90deg, rgba(22,24,29,0), rgba(22,24,29,0.06), rgba(22,24,29,0))"></span>
        </span></span>
      </button>
      <span style="position: absolute; left: 16px; top: -14px; z-index: 2; display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E5E5E1; box-shadow: 0 2px 8px rgba(22,24,29,0.08); font-size: 12px; font-weight: 600; line-height: 1; color: #16181D; white-space: nowrap">{{t.tablet}}</span>
    </div>

    <div style="position: absolute; left: 772px; top: 336px; width: 172px; z-index: 4">
      <button type="button" aria-label="{{t.openPhone}}" style="position: relative; display: block; width: 100%; box-sizing: border-box; margin: 0; padding: 2px; border: 0; border-radius: 32px; background: #4A4E57; box-shadow: 0 30px 80px rgba(22,24,29,0.16), inset 0 0 0 1px rgba(255,255,255,0.12); cursor: zoom-in; font: inherit">
        <span aria-hidden="true" style="position: absolute; right: -3px; top: 21%; width: 3px; height: 30px; border-radius: 0 2px 2px 0; background: #3A3E46"></span>
        <span aria-hidden="true" style="position: absolute; right: -3px; top: 31%; width: 3px; height: 50px; border-radius: 0 2px 2px 0; background: #3A3E46"></span>
        <span style="display: block; padding: 4px; border-radius: 30px; background: #0E0F12">
        <span style="position: relative; display: block; border-radius: 26px; overflow: hidden; background: #FFFFFF">
        <img src="../assets/phone.webp" width="1080" height="2364" alt="{{t.altPhone}}" style="display: block; width: 100%; height: auto">
          <span aria-hidden="true" style="position: absolute; left: 50%; top: 7px; width: 8px; height: 8px; margin-left: -4px; border-radius: 999px; background: #0E0F12"></span>
        </span></span>
      </button>
      <span style="position: absolute; left: 18px; top: -14px; z-index: 2; display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E5E5E1; box-shadow: 0 2px 8px rgba(22,24,29,0.08); font-size: 12px; font-weight: 600; line-height: 1; color: #16181D; white-space: nowrap">{{t.phone}}</span>
    </div>
  </div>

  <a href="https://app.endure-cycling.com/" style="margin-top: 48px; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 16px; font-weight: 600; color: #16181D; text-decoration: none">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18"></path></svg>
    <span style="border-bottom: 2px solid #C2552B; padding-bottom: 3px">{{t.link}}</span>
    <span aria-hidden="true">→</span>
  </a>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","de"],"default":"en"},"$preview":{"width":1024,"height":1270}}'>
class Component extends DCLogic {
  renderVals() {
    var de = this.props.lang === 'de';
    var t = de ? {
      eyebrow: 'HANDY · TABLET · WINDOWS · BROWSER',
      headline: 'Ein Plan auf jedem Bildschirm.',
      body: 'Kalender, Coach und Analyse findest du auf dem Handy, dem Tablet, in der Windows-App und im Browser, überall mit denselben Daten. Plan am Schreibtisch und fahr mit der App am Trainer.',
      link: 'ENDURE im Browser öffnen',
      phone: 'Handy', tablet: 'Tablet', windows: 'Windows', browser: 'Browser',
      altPhone: 'ENDURE-Kalenderwoche auf einem Android-Handy',
      altTablet: 'ENDURE-Kalender auf einem aufgeklappten Pixel Fold',
      altWindows: 'ENDURE-Kalender in der Windows-App',
      altBrowser: 'ENDURE-Kalender in der Web-App im Browser',
      openPhone: 'Handy-Ansicht in voller Größe öffnen',
      openTablet: 'Tablet-Ansicht in voller Größe öffnen',
      openWindows: 'Windows-Ansicht in voller Größe öffnen',
      openBrowser: 'Browser-Ansicht in voller Größe öffnen'
    } : {
      eyebrow: 'PHONE · TABLET · WINDOWS · BROWSER',
      headline: 'One plan on every screen.',
      body: 'Your calendar, coach and analysis are on your phone, your tablet, the Windows app and the browser, with the same data on each. Plan at your desk and ride with the app on the trainer.',
      link: 'Open ENDURE in your browser',
      phone: 'Phone', tablet: 'Tablet', windows: 'Windows', browser: 'Browser',
      altPhone: 'ENDURE calendar week on an Android phone',
      altTablet: 'ENDURE calendar on an unfolded Pixel Fold',
      altWindows: 'ENDURE calendar in the Windows app',
      altBrowser: 'ENDURE calendar in the web app in a browser',
      openPhone: 'Open the phone view full size',
      openTablet: 'Open the tablet view full size',
      openWindows: 'Open the Windows view full size',
      openBrowser: 'Open the browser view full size'
    };
    return { t: t };
  }
}
</script>
</body>
</html>
